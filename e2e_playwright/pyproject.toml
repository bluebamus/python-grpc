[project]
name = "grpc-samples-e2e-playwright"
version = "0.1.0"
description = "실제 브라우저(Chromium)로 SSE/WebSocket 게이트웨이를 검증하는 Playwright E2E"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-playwright>=0.5.2",
    "playwright>=1.48.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
