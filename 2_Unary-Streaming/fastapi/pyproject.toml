[project]
name = "grpc-unary-fastapi-gateway"
version = "0.1.0"
description = "FastAPI HTTP->gRPC 게이트웨이 샘플 (2_Unary-Streaming)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
