syntax = "proto3";

// 책 정보
message Book {
    string isbn = 1;
    string title = 2;
    string author = 3;
    string publisher = 4;
    string published_date = 5;
    float price = 6;
    int32 page_count = 7;
    string genre = 8;
}

// 고객 정보
message Customer {
    string id = 1;
    string name = 2;
    string email = 3;
    string address = 4;
    string phone_number = 5;
}

// 주문 정보
message Order {
    string order_number = 1;
    Customer customer = 2;
    repeated Book items = 3;
    string order_date = 4;
    string shipping_status = 5;
}
