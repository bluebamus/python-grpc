[project]
name = "bookstore-protobuf-django"
version = "0.1.0"
description = "Django protobuf 직렬화 데모 (1_bookstore)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
