syntax = "proto3";

package reflection_example;

service EchoService {
    rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
    string message = 1;
}

message EchoResponse {
    string message = 1;
}

// 생성 명령:
// python -m grpc_tools.protoc -I=. --python_out=. --grpc_python_out=. reflection_example.proto
