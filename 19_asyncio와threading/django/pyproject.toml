[project]
name = "asyncio-task-queue-django"
version = "0.1.0"
description = "Django queue.Queue + threading 작업 큐 샘플 (19_asyncio와threading)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
