syntax="proto3";

package metadata_example;

service EchoService{
    rpc Echo(EchoRequest)returns(EchoResponse);
}

message EchoRequest{
    string message=1;
}

message EchoResponse{
    string message=1;
}

// uv run python -m grpc_tools.protoc -I=. --python_out=. --grpc_python_out=. metadata_example.proto